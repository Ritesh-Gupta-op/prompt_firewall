[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "promptfirewall"
version = "0.1.0"
description = "Backend prompt firewall with isolated, observable security evaluation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0.30,<3",
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.23,<1",
  "coverage>=7.6,<8",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-requests>=2.32,<3",
  "pip-tools==7.5.1",
  "pip==25.2",
  "setuptools==80.9.0",
  "wheel==0.45.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["promptfirewall"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
