services:
  promptfirewall:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    init: true
    stop_grace_period: 130s
    environment:
      PROMPTFIREWALL_DATABASE_URL: sqlite+aiosqlite:////data/promptfirewall.db
    volumes:
      - promptfirewall-data:/data

volumes:
  promptfirewall-data:
