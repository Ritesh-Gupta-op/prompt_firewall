services:
  promptfirewall:
    build: .
    ports:
      - "8000:8000"
    environment:
      PROMPTFIREWALL_DATABASE_URL: sqlite+aiosqlite:////data/promptfirewall.db
      PROMPTFIREWALL_CORS_ORIGINS: http://localhost:5173
    volumes:
      - promptfirewall-data:/data

volumes:
  promptfirewall-data:
