[project]
name = "promptfirewall"
version = "0.1.0"
description = "Backend prompt firewall with isolated, observable security evaluation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy[asyncio]>=2.0.30,<3",
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
]

[tool.vercel]
entrypoint = "main:app"

[tool.fastapi]
entrypoint = "main:app"
